# ==============================================================================
# AuraKafka - Docker Compose Local Development Environment
# Stack: AuraKafka Web Dashboard + Apache Kafka (KRaft) + Kafka UI + Schema Registry
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. AuraKafka Embedded Web Portal & Observability Dashboard
  # ----------------------------------------------------------------------------
  aurakafka-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: aurakafka-web:latest
    container_name: aurakafka-web
    restart: unless-stopped
    ports:
      - "${AURAKAFKA_WEB_PORT:-9095}:9090"
    environment:
      PORT: 9090
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://127.0.0.1:9090/api/cluster', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - aurakafka-net

  # ----------------------------------------------------------------------------
  # 2. Apache Kafka Broker (KRaft Mode - No ZooKeeper required)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: aurakafka-broker
    restart: unless-stopped
    ports:
      - "${KAFKA_BROKER_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:9094,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:${KAFKA_BROKER_PORT:-9092},PLAINTEXT_INTERNAL://kafka:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT_INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      CLUSTER_ID: '${KAFKA_CLUSTER_ID:-4L622nShTUiBENAzNu64UQ}'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aurakafka-net

  # ----------------------------------------------------------------------------
  # 3. Topic Initializer (Creates standard AuraKafka topics on startup)
  # ----------------------------------------------------------------------------
  init-kafka:
    image: apache/kafka:3.8.0
    container_name: aurakafka-init-topics
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Provisioning default AuraKafka topics in KRaft cluster..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic orders-stream --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic user-events --partitions 2 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic payments --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic quickstart-events --partitions 1 --replication-factor 1
        echo "Cluster topics initialized successfully:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --list
    networks:
      - aurakafka-net

  # ----------------------------------------------------------------------------
  # 4. Provectus Kafka UI (Cluster Management & Topic Browser)
  # ----------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aurakafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'AuraKafka-Local'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9094'
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: 'http://schema-registry:8081'
    networks:
      - aurakafka-net

  # ----------------------------------------------------------------------------
  # 5. Confluent Schema Registry
  # ----------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: aurakafka-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9094'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aurakafka-net

  # ----------------------------------------------------------------------------
  # 6. AuraKafka Toolchain & CLI (Optional profile for running Aura in Docker)
  # ----------------------------------------------------------------------------
  aurakafka-cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    image: aurakafka-tools:latest
    container_name: aurakafka-cli
    profiles:
      - tools
      - cli
    volumes:
      - .:/app
    networks:
      - aurakafka-net
    command: ["/bin/bash", "-c", "echo 'AuraKafka CLI ready. Run: docker compose run aurakafka-cli ./start-local.sh all'; tail -f /dev/null"]

# ------------------------------------------------------------------------------
# Persistent Volumes & Network Definitions
# ------------------------------------------------------------------------------
volumes:
  kafka-data:
    name: aurakafka-data

networks:
  aurakafka-net:
    name: aurakafka-network
    driver: bridge
